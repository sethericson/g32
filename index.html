/* Layout: the field canvas fills the whole window (wider screens see more field); front-office hub, press room and draft board are full-window HTML screens. Single dark arcade look by design. */
:root{
  --bg:#070a1c; --panel:#141a3d; --panel2:#1f2862; --hi:#6f7fe8; --lo:#03040f;
  --ink:#eef0ff; --dim:#97a0d6; --gold:#ffc933; --cyan:#3fd8ff; --red:#ff4d63; --green:#52f08a; --empty:#2c3366;
  --px:'Press Start 2P', 'Courier New', monospace; --ui:'VT323', 'Courier New', monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:#05071a}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:21px;line-height:1.15;overflow:hidden}
#app{position:relative;height:100%;width:100%}
#stageWrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#05071a}
#stage{position:relative;container-type:size}
#cv{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;cursor:crosshair}
#sui{position:absolute;inset:0;pointer-events:none}
#sui > *{pointer-events:auto}
.srow{position:absolute;left:0;right:0;bottom:calc(3cqh + var(--sab));display:flex;justify-content:center;gap:1.4cqw;flex-wrap:wrap;padding:0 2cqw}
.srow.trk{justify-content:flex-end;bottom:calc(14cqh + var(--sab));pointer-events:none}.srow.trk .btn{pointer-events:auto;touch-action:none;user-select:none}
.stop{position:absolute;top:9.5cqh;right:max(1.2cqw,var(--sar));display:flex;gap:1cqw}
.scol{position:absolute;left:50%;top:58%;transform:translateX(-50%);display:flex;flex-direction:column;gap:2.2cqh;align-items:stretch;min-width:min(34cqw,320px)}
.btn{font-family:var(--px);font-size:12px;padding:10px 14px;color:#2a1400;cursor:pointer;border:2px solid;border-color:#fff3b8 #7a3d00 #7a3d00 #fff3b8;
  background:linear-gradient(180deg,#ffe78a 0%,#ffbf1f 48%,#e58c00 52%,#c56a00 100%);box-shadow:0 0 0 2px #000;text-shadow:0 1px 0 #fff0b0;letter-spacing:.5px;white-space:nowrap;transition:transform .08s,filter .12s}
.btn:hover{filter:brightness(1.12);transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px dashed var(--cyan);outline-offset:3px}
.btn[disabled]{filter:grayscale(1) brightness(.6);cursor:not-allowed;transform:none}
.btn.blue{color:#00203a;border-color:#c9f4ff #00446e #00446e #c9f4ff;background:linear-gradient(180deg,#9fefff 0%,#3fd0ff 48%,#1497d6 52%,#0a6fa8 100%);text-shadow:0 1px 0 #d8fbff}
.btn.red{color:#fff;border-color:#ffb3bd #6e0016 #6e0016 #ffb3bd;background:linear-gradient(180deg,#ff8a99 0%,#ff4d63 48%,#d61f3a 52%,#9c0c25 100%);text-shadow:0 1px 0 #6e0016}
.btn.ghost{color:var(--ink);border-color:#4a56a8 #050716 #050716 #4a56a8;background:linear-gradient(180deg,#2a3478,#151b45);text-shadow:0 1px 0 #000}
.btn.green{color:#00290f;border-color:#c8ffd9 #00561d #00561d #c8ffd9;background:linear-gradient(180deg,#a6ffc2 0%,#52f08a 48%,#1fc25a 52%,#0f8a3c 100%);text-shadow:0 1px 0 #d9ffe5}
.btn.xs{font-size:8px;padding:5px 7px}
#sui .btn{font-size:clamp(7px,1.9cqw,14px);padding:1.5cqh 2cqw}
#sui .btn.sm{font-size:clamp(6px,1.4cqw,11px);padding:1cqh 1.2cqw}
.playname{position:absolute;left:0;right:0;bottom:calc(14cqh + var(--sab));text-align:center;font-family:var(--px);font-size:clamp(7px,1.6cqw,13px);color:#fff;text-shadow:2px 2px 0 #000;pointer-events:none}
.playname b{color:var(--gold);font-weight:normal}

/* coach tip (tutorial) */
.coachtip{position:absolute;top:calc(9cqh + 4px);left:50%;transform:translateX(-50%);width:min(92cqw,640px);display:flex;gap:10px;align-items:flex-start;background:linear-gradient(180deg,#1f2862,#10153a);border:2px solid;border-color:var(--hi) var(--lo) var(--lo) var(--hi);box-shadow:0 0 0 2px #000,0 8px 24px rgba(0,0,0,.5);padding:8px 10px;animation:tipIn .35s cubic-bezier(.2,1.4,.4,1)}
.coachtip .who{font-family:var(--px);font-size:8px;color:var(--gold);margin-bottom:4px}
.coachtip p{margin:0;font-size:clamp(14px,2.1cqw,18px)}
.coachtip.low{top:auto;bottom:calc(2cqh + var(--sab));left:max(1.5cqw,var(--sal));transform:none;width:min(40cqw,420px);animation:none}
.coachtip .skip{margin-left:auto;align-self:flex-start;pointer-events:auto}
#sui > .coachtip,#sui > .playname{pointer-events:none}
@keyframes tipIn{from{transform:translate(-50%,-14px);opacity:0}to{transform:translate(-50%,0);opacity:1}}

/* hub */
#hub{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;background:
  repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 2px,transparent 2px 4px),
  radial-gradient(ellipse at 50% -10%,#1b2566 0%,transparent 60%),
  linear-gradient(180deg,#0c1236,#070a1c 60%)}
.wrap{max-width:1080px;margin:0 auto;padding-block:14px 40px;padding-left:max(16px,var(--sal));padding-right:max(16px,var(--sar));display:flex;flex-direction:column;gap:14px}
.wrap > *{animation:rise .38s both}
.wrap.still > *{animation:none}

/* ===================== MOBILE BUILD (landscape-first) ===================== */
:root{--vw:1vw;--vh:1vh;--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
html,body{position:fixed;inset:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}

/* held upright: the whole game turns itself sideways */
#app.rot{position:fixed;top:0;inset-inline:auto;transform-origin:0 0;transform:rotate(90deg)}
#stageWrap{padding-left:var(--sal);padding-right:var(--sar);box-sizing:border-box}
#cv{image-rendering:auto;cursor:default}
@media (hover:none){.btn:hover{filter:none;transform:none}.tab:hover{color:var(--dim)}.tab[aria-selected="true"]:hover{color:#1d1000}}
/* on-field buttons: big, thumb sized */
#sui .btn{font-size:clamp(9px,2.1cqw,15px);padding:1.9cqh 2.3cqw;min-height:42px;min-width:64px}
#sui .btn.sm{font-size:clamp(8px,1.5cqw,12px);padding:1.4cqh 1.4cqw;min-height:32px;min-width:0}
.srow{gap:2cqw;bottom:calc(4cqh + var(--sab))}
.srow.trk{bottom:calc(15cqh + var(--sab));padding-right:max(2cqw,var(--sar))}
.stop{gap:1.4cqw;right:max(1.2cqw,var(--sar))}
.playname{bottom:calc(16.5cqh + var(--sab));font-size:clamp(8px,1.8cqw,14px)}
.coachtip p{font-size:clamp(14px,2.2cqw,19px)}
.coachtip .skip{min-height:34px}
/* front office (hub / press / draft): thumb-friendly + compact in landscape */
.btn{min-height:44px}
.btn.xs{min-height:34px;font-size:9px;padding:6px 9px}
.tab{min-height:42px;padding:10px 14px;font-size:10px}
#hub{-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:var(--sab)}
.wrap{padding-left:max(14px,var(--sal));padding-right:max(14px,var(--sar))}
@media (max-height:560px){
  body{font-size:19px}
  .wrap{padding-block:8px calc(26px + var(--sab));gap:9px}
  .panel{padding:10px 11px}
  .ptitle{font-size:10px;margin-bottom:8px}
  .top{gap:10px;flex-wrap:nowrap;align-items:center}
  .top .crest{width:42px;height:42px;font-size:9px}
  .tname{font-size:12px}
  .sub{font-size:17px}
  .stats{gap:6px;flex-wrap:nowrap;margin-left:auto}
  .chip{min-width:0;padding:3px 8px;white-space:nowrap}.chip b{font-size:10px;margin-top:1px}.chip span{font-size:13px}
  .bar{height:6px;margin-top:3px}
  .tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;position:sticky;top:0;z-index:6;padding:5px 0;margin-block:-2px;background:linear-gradient(180deg,#0a0f2e 70%,rgba(10,15,46,0));-webkit-overflow-scrolling:touch}
  .tabs::-webkit-scrollbar{display:none}
  .tabs .tab{white-space:nowrap;flex:none}
  .tabs .spacer{flex:1 0 8px}
  .grid2{gap:10px}
  .qbox{padding-block:10px 20px}
  #modal{padding:8px}
}
/* hint line: keep it on one row */
.gate .g,#gate .g{padding:0 6vw}
</style>

 ['Atlanta','ATL','#a71930','#101010','F'],['Carolina','CAR','#0085ca','#101820','F'],['New Orleans','NO','#101820','#d3bc8d','F'],['Tampa','TB','#d50a0a','#b1aaa0','F'],
 ['Los Angeles','LA','#003594','#ffa300','F'],['San Francisco','SF','#aa0000','#b3995d','F'],['Seattle','SEA','#002244','#69be28','F'],['Arizona','ARI','#97233f','#f2f2f2','F'],
].map(([name,ab,c1,c2,conf])=>({name,ab,c1,c2,conf}));

const SLOT_LABEL={QB:'Quarterback',RB:'Running Back',WR1:'Wide Receiver',WR2:'Wide Receiver',TE:'Tight End',OL1:'Off. Line',OL2:'Off. Line',K:'Kicker',DL:'Def. Line',LB:'Linebacker',CB:'Cornerback',S:'Safety'};

const salaryFor=o=>Math.round((0.8+o*o*0.17)*10)/10;

/* ---------- looks (portraits + on-field skin tone) ---------- */
const SKIN=['#f6d3b3','#e3b48c','#c68a5c','#93613d','#5e3b22'];
const TONES=SKIN;
const HAIRC=['#16100c','#3a2416','#6b4423','#b07a3c','#dcb66e','#8c2f1c','#8e8e94','#e6e6ea'];
const HAIRC_NAMES=['BLACK','DARK BROWN','BROWN','LIGHT BROWN','BLOND','RED','GRAY','WHITE'];
const HAIR_P=['buzz','short','fade','afro','dreads','mohawk','bald','cornrows','long','curly'];
const HAIR_C=['short','slick','buzz','bald','curly','long','balding','spiky','afro','fade'];
const BEARD=['none','stubble','mustache','goatee','full'];
const OUTFIT=['polo','hoodie','suit','windbreaker'];
const HAT=['none','cap','visor'];
function genLook(seed){
  const R=mulberry32(typeof seed==='number'?seed:hashStr(seed));const p=a=>a[Math.floor(R()*a.length)];
  const skin=Math.floor(R()*5);
  const hairCol=skin>=3?(R()<.85?0:R()<.5?1:4):(R()<.55?p([0,1,2]):p([3,4,5,1]));
  return {skin,hair:p(HAIR_P),hairCol,beard:R()<.5?'none':p(BEARD),eyeBlack:R()<.35,band:R()<.14,mouth:Math.floor(R()*3),brow:Math.floor(R()*2),big:R()<.25};
}
const DEFAULT_COACH={skin:1,hair:'short',hairCol:1,beard:'none',glasses:false,hat:'cap',outfit:'polo',headset:true,mouth:1,brow:0};

function potFor(ovr,age){
  /* potential ceiling on the 1-10 scale (stars = /2): young players have room to grow, vets are near their level */
  const o=Math.round(ovr);let room;
  if(age<=23)room=rint(0,6);else if(age<=25)room=rint(0,4);else if(age<=28)room=rint(0,2);else room=rint(0,1);
  return clamp(Math.max(o+room,1),1,10)}
function mkPlayer(slot,ovr,age){
  age=age||rint(22,31);
  const id='p'+Date.now().toString(36)+(UID++)+Math.floor(Math.random()*1e4).toString(36);
  const look=genLook(id);if(['OL','DL'].includes(posOf(slot)))look.big=true;
  return {id,name:pick(FIRST)+' '+pick(LASTN),slot,ovr:clamp(ovr,1,10),age,xp:rint(0,40),
    sal:salaryFor(ovr),yrs:rint(1,3),morale:rint(60,80),inj:0,tone:look.skin,look,ceil:potFor(ovr,age),acq:S?S.season:0,pot:age<25?+rnd(1.1,1.6).toFixed(2):1,
    season:{yds:0,td:0,gp:0},car:{yds:0,td:0,gp:0}};
}
/* half-star rating display: 0-10 internal scale → 5 drawn stars, half stars drawn as half-filled stars */
const SV=(cls)=>`<svg viewBox="0 0 20 20" aria-hidden="true">${cls}</svg>`;
const ST_E='<use href="#star" class="e"/>',ST_F='<use href="#star" class="f"/>',ST_H='<use href="#star" class="e"/><use href="#star" class="f" clip-path="url(#halfL)"/>';
function starsHTML(o,lg){const v=Math.round(clamp(o,0,10));let h='';for(let i=0;i<5;i++){const s=v-i*2;h+=SV(s>=2?ST_F:s===1?ST_H:ST_E)}return `<span class="stars${lg?' lg':''}" role="img" aria-label="${(v/2).toFixed(1)} of 5 stars" title="${(v/2).toFixed(1)} of 5">${h}</span>`}
const unknownStars=()=>`<span class="stars" title="Scout to reveal"><span class="q">? ? ?</span></span>`;
const OBJ=[
 {id:'pass250',txt:'Pass for 250+ yards',ok:g=>g.stats.passYds>=250},
 {id:'rush100',txt:'Rush for 100+ yards',ok:g=>g.stats.rushYds>=100},
 {id:'win14',txt:'Win by 14+ points',ok:g=>g.score[0]-g.score[1]>=14},
 {id:'noint',txt:'Win without throwing an interception',ok:g=>g.stats.int===0&&g.score[0]>g.score[1]},

 {id:'pct70',txt:'Complete 70% of passes (10+ attempts)',ok:g=>g.stats.att>=10&&g.stats.comp/g.stats.att>=.7},

];

/* ---------- saves: five slots + settings ---------- */
const NSLOTS=5,SLOT_KEY=n=>'gridiron32.slot.'+n;
let S=null,SLOT=0;
function save(){if(!S||!SLOT)return;try{localStorage.setItem(SLOT_KEY(SLOT),JSON.stringify(S))}catch(e){}}
function readSlot(n){try{const t=localStorage.getItem(SLOT_KEY(n));return t?JSON.parse(t):null}catch(e){return null}}
function wipeSlot(n){try{localStorage.removeItem(SLOT_KEY(n))}catch(e){}}
let SET={sound:true,music:true};
try{const t=localStorage.getItem('gridiron32.settings');if(t)SET=Object.assign(SET,JSON.parse(t))}catch(e){}
function saveSet(){try{localStorage.setItem('gridiron32.settings',JSON.stringify(SET))}catch(e){}}

function makeSchedule(){
  const n=32;let arr=[...Array(n).keys()].sort(()=>Math.random()-.5);const weeks=[];
  for(let r=0;r<WEEKS;r++){const wk=[];for(let i=0;i<n/2;i++){const a=arr[i],b=arr[n-1-i];wk.push((r+i)%2?[a,b]:[b,a])}weeks.push(wk);arr=[arr[0],arr[n-1],...arr.slice(1,n-1)]}
  return weeks;
}
function genFA(n){const a=[];for(let i=0;i<n;i++){const slot=pick(['QB','RB','WR1','TE','OL1','K','DL','LB','CB','S']);const o=clamp(Math.round(rnd(3,8.4)),1,10);const p=mkPlayer(slot,o,rint(23,33));p.sal=+(salaryFor(o)*rnd(1.05,1.25)).toFixed(1);p.yrs=rint(1,3);p.from=rint(0,31);a.push(p)}return a}
function record(a,b,sa,sb){const A=S.teams[a],B=S.teams[b];A.pf+=sa;A.pa+=sb;B.pf+=sb;B.pa+=sa;if(sa>sb){A.w++;B.l++}else if(sb>sa){B.w++;A.l++}else{A.t++;B.t++}}
function playSim(h,a){const A=S.teams[h],B=S.teams[a];let hs=simScore(A.off,B.def,true),as=simScore(B.off,A.def,false);if(hs===as){Math.random()<.5?hs+=3:as+=3}record(h,a,hs,as)}
function isEliminated(){const me=S.team,c=TEAMS[me].conf,maxW=S.teams[me].w+(WEEKS-S.week);return S.teams.filter((t,i)=>i!==me&&TEAMS[i].conf===c&&t.w>maxW).length>=4}
function playOutEarlySeason(){
  const me=S.team;
  for(let tries=0;tries<60;tries++){
    S.teams.forEach(t=>{t.w=t.l=t.t=t.pf=t.pa=0});S.results=[];
    const wins=rint(1,2),winWeeks=new Set();while(winWeeks.size<wins)winWeeks.add(rint(0,START_WEEK-1));
    for(let wk=0;wk<START_WEEK;wk++)for(const[h,a]of S.sched[wk]){
      if(h!==me&&a!==me){playSim(h,a);continue}
      const home=h===me,opp=home?a:h,O=S.teams[opp];
      let us=simScore(3.4,O.def,home),them=simScore(O.off,3.4,!home);const win=winWeeks.has(wk);
      if(win&&us<=them)us=them+rint(1,7);if(!win&&us>=them)them=us+rint(1,10);
      record(me,opp,us,them);S.results.push({week:wk,opp,us,them,res:win?'W':'L',home});
    }
    if(isEliminated())return;
  }
  const c=TEAMS[me].conf,maxW=S.teams[me].w+(WEEKS-S.week);
  S.teams.map((t,i)=>i).filter(i=>i!==me&&TEAMS[i].conf===c).sort((a,b)=>S.teams[b].w-S.teams[a].w).slice(0,4).forEach(i=>{const t=S.teams[i];while(t.w<=maxW&&t.l>0){t.w++;t.l--}});
}
function newCareer(teamIdx,coach,look){
  S={v:2,coach,look,team:teamIdx,season:1,week:START_WEEK,phase:'regular',credits:3,fans:38,
    fac:{train:1,rehab:1,stadium:1,oc:1,dc:1},roster:[],bench:[],fa:genFA(6),teams:[],sched:makeSchedule(),news:[],
    trophies:0,history:[],champs:[],objective:pick(OBJ).id,playoff:null,off:null,results:[],picks:[],tut:false,pq:[],potv:1};
  TEAMS.forEach(()=>S.teams.push({off:+rnd(4,7.6).toFixed(1),def:+rnd(4,7.6).toFixed(1),w:0,l:0,t:0,pf:0,pa:0}));
  /* new saves start with only six real players, from bad to the upper end of decent; the other six lineup spots are hidden default fill-ins */
  const START6=['QB','RB','WR1','TE','OL1','DL'],lv=[1,2,3,4,5,6];for(let i=lv.length-1;i>0;i--){const j=rint(0,i);[lv[i],lv[j]]=[lv[j],lv[i]]}
  for(const s of SLOTS){const k=START6.indexOf(s);if(k<0){S.roster.push(mkBackup(s));continue}const p=mkPlayer(s,lv[k]);p.acq=0;S.roster.push(p)}
  const star=S.roster.filter(p=>!p.def).sort((a,b)=>b.ovr-a.ovr)[0];star.sal=salaryFor(star.ovr);star.age=rint(22,24);star.pot=1.4;star.ceil=Math.max(star.ceil,star.ovr+rint(1,4));
  playOutEarlySeason();
  const me=S.teams[teamIdx],t=TEAMS[teamIdx];
  addNews(`${t.name} fires its head coach after a ${me.w}-${me.l} start. Coach ${coach} is hired with ${WEEKS-START_WEEK} games left.`);
  addNews(`${t.name} has been eliminated from playoff contention. The owner wants to see effort, not excuses.`);
  addNews(`Scouts say ${star.name} (${posOf(star.slot)}) is the only bright spot on this roster.`);
}
function addNews(t){S.news.unshift(`S${S.season} · ${t}`);S.news=S.news.slice(0,40)}
const getSlot=s=>S.roster.find(p=>p.slot===s);
/* who actually plays a slot: a healthy starter, else the best healthy bench player at that position */
function active(s){const st=getSlot(s);if(st&&st.inj<=0&&!(st.susp>0))return st;const pos=posOf(s);const b=(S.bench||[]).filter(p=>posOf(p.slot)===pos&&p.inj<=0&&!(p.susp>0)).sort((a,b)=>b.ovr-a.ovr)[0];return b||st}
const capTotal=()=>90+(S.fac.stadium-1)*4;
const XP_COST=50;
const ATTR_W=[.4,.2,.2,.2];
function attrNames(pos){if(pos==='QB')return['ACCURACY','ARM STRENGTH','SPEED','STAMINA'];if(pos==='K')return['ACCURACY','POWER','CLUTCH','STAMINA'];
  if(['RB','WR','TE'].includes(pos))return['CATCHING','STRENGTH','SPEED','STAMINA'];if(pos==='OL')return['BLOCKING','STRENGTH','SPEED','STAMINA'];return['TACKLING','STRENGTH','SPEED','STAMINA']}
function ensureAttrs(p){
  if(p.at&&p.am)return p;const T=p.ovr;const at=[0,1,2,3].map(()=>clamp(Math.round(T+rnd(-1.2,1.2)),1,10));
  for(let k=0;k<10;k++){const avg=at.reduce((a,v,i)=>a+v*ATTR_W[i],0),d=T-avg;if(Math.abs(d)<=.25)break;const i=rint(0,3);at[i]=clamp(at[i]+(d>0?1:-1),1,10)}
  const room=p.def?0:Math.max(0,(p.ceil||10)-T);p.at=at;p.am=at.map(v=>clamp(v+Math.round(room*rnd(.8,1.2)),v,10));return p}
function upgradeAttr(p,i){ensureAttrs(p);if(p.at[i]>=p.am[i])return false;p.at[i]++;p.ovr=+Math.min(10,p.ovr+ATTR_W[i]).toFixed(1);return true}
const hasRoom=p=>{ensureAttrs(p);return p.at.some((v,i)=>v<p.am[i])};
const allPlayers=()=>{const l=S.roster.concat(S.bench||[]);l.forEach(ensureAttrs);return l};
const payroll=()=>+allPlayers().reduce((a,p)=>a+p.sal,0).toFixed(1);
function effOvr(p){
  if(!p)return 3; if(p.inj>0||p.susp>0)return 2.5;
  const off=OFF_SLOTS.includes(p.slot);const staff=off?(S.fac.oc-1)*.2:(S.fac.dc-1)*.25;
  return clamp(p.ovr*(.88+p.morale*.0024)+staff,1,11.5);
}
const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
function myDefRating(){return avg(['DL','LB','CB','S'].map(s=>effOvr(active(s))))}
function myOffRating(){const e=s=>effOvr(active(s));return (e('QB')*2+e('RB')+e('WR1')+e('WR2')+e('TE')+e('OL1')+e('OL2'))/8}
const teamMorale=()=>Math.round(avg(S.roster.map(p=>p.morale)));

function onPointerDown(p){

  if(b.state==='held'&&b.holder===P.qb&&P.canPass){PTR.aim=true;return}

}
function onPointerUp(p){
  if(mode==='game'&&G&&G.phase==='krchoice'){if(Math.abs(PTR.x-PTR.x0)>24)krTouchback();else krRun();return}
  if(mode==='game'&&G&&G.phase==='kick'){kickRelease();return}
  if(mode!=='game'||!G||G.phase!=='play'||!P||P.over){PTR.aim=false;PTR.steer=false;return}
  const quick=performance.now()-PTR.t0<220&&hyp(PTR.x-PTR.x0,PTR.y-PTR.y0)<9;
  if(PTR.aim){PTR.aim=false;
    if(!quick&&hyp(PTR.x-PTR.x0,PTR.y-PTR.y0)>=10){const[tx,ty]=aimTarget();P.free=true;throwTo(tx,ty)}
    else if(quick){const[qx,qy]=w2s(P.qb.x,P.qb.y,G.cam);if(hyp(p.x-qx,(p.y-qy+8))<16){P.canPass=false;P.fx.push({t:'SCRAMBLE!',x:P.qb.x,y:P.qb.y-6,life:.9})}}
    return}
  if(PTR.steer){PTR.steer=false;if(P.type==='kr'&&P.ret&&carrier()===P.ret&&P.ret.x<0&&Math.abs(PTR.x-PTR.x0)>24){kneel();return}if(quick||(PTR.x-PTR.x0>24&&performance.now()-PTR.t0<380&&Math.abs(PTR.y-PTR.y0)<18))dive()}
}
function kneel(){const r=P.ret;if(!r||P.over)return;r.kneel=true;r.vx=r.vy=0;P.fx.push({t:'KNEEL',x:r.x,y:r.y-6,life:.8});endPlay({type:'tackle',spot:0},'down')}
function juke(dir){const c=carrier();if(!c||!runnerActive()||c.dive||P.over||c.jkCd>0||false)return;
  c.jk=.2;c.jkDir=dir;c.jkCd=.6;c.cutT=.34;c.vy=dir*c.spd*1.9;c.truck=false;SFX.juke();dust(c.x-.3,c.y,5,.9)}

function onKey(k){
  if(mode==='title'&&(k==='enter'||k===' ')){const b=$('#sui .btn');if(b)b.click();return}
  if(mode!=='game'||!G)return;
  if(k==='m'){SET.sound=!SET.sound;saveSet();if(!SET.sound)Crowd.stop();else Crowd.start();updateGameUI();return}
  if(G.phase==='banner'&&(k===' '||k==='enter')){if(G.banner.dur<G.banner.t0-.35)G.banner.dur=0;return}

  if(G.phase==='presnap'){if(k==='p'||k===' ')callPlay('pass');else if(k==='r')callPlay('run');else if(k==='t')timeout();else if(k==='k'&&canFG())startKickFromPresnap();else if(k==='u'&&G.down===4&&!G.tut)punt();return}
  if(G.phase==='call'){if(k===' '||k==='enter'||k==='s')snap();else if(k==='a')audible();else if(k==='escape'||k==='b'||k==='backspace')cancelCall();else if(k==='p')callPlay('pass');else if(k==='r')callPlay('run');return}
  if(G.phase==='pat'){if(k==='k'||k===' ')startKick('xp');else if(k==='2')go2();return}
  if(G.phase==='okchoice'){if(k===' '||k==='enter')okDeep();else if(k==='o')okOnside();return}
  if(G.phase==='krchoice'){if(k==='arrowleft'||k==='arrowright'||k==='a'||k==='d'||k==='t')krTouchback();else if(k==='arrowup'||k==='arrowdown'||k==='w'||k==='s'||k===' '||k==='enter'||k==='r')krRun();return}

    if(P.type==='kr'&&carrier()===P.ret&&P.ret.x<0&&(k==='arrowleft'||k==='arrowright'||k==='a'||k==='d')){kneel();return}

    if(k==='d'||k==='arrowright')dive();

    if(map[k]&&P.ball.state==='held'&&P.ball.holder===P.qb&&P.canPass){const[tx,ty]=leadTarget(map[k]);throwTo(tx,ty)}

}

/* ---------- endGame & season ---------- */
let LAST=null;
function endGame(){
  if(G.phase==='final')return;G.phase='final';

  if(!G.playoff){me.pf+=us;me.pa+=them;op.pf+=them;op.pa+=us;if(res==='W'){me.w++;op.l++}else if(res==='L'){me.l++;op.w++}else{me.t++;op.t++}}

  let credits=0;const lines=[];
  if(res==='W'){credits+=G.playoff?2:1;lines.push(['Win',G.playoff?'+2':'+1'])}
  if(objOK){credits+=1;lines.push(['Objective: '+obj.txt,'+1'])}

  S.fans=clamp(S.fans+fd,0,200);

  S.credits+=credits;
  // xp & morale
  const tm=1+(S.fac.train-1)*.22;const ups=[],xpGain={};
  const starters=new Set(S.roster.map(p=>p.id));
  for(const p of allPlayers()){
    const played=starters.has(p.id)||!!G.ps[p.id]||SLOTS.some(sl=>active(sl)===p);
    const st=G.ps[p.id]||{pass:0,rush:0,rec:0,td:0,ptd:0,int:0};let xp=0;
    if(p.slot==='QB')xp=st.pass/8+st.ptd*10-st.int*5+st.rush/5;
    else if(['RB','WR1','WR2','TE'].includes(p.slot))xp=(st.rush+st.rec)/4+st.td*10;
    else if(p.slot==='K')xp=8+G.stats.fg*6;
    else if(p.slot.startsWith('OL'))xp=10+(G.stats.sacks===0?8:0)+G.stats.rushYds/20;
    else xp=8+(them<=14?12:them<=24?5:0);
    if(res==='W')xp+=6;xp=Math.max(2,xp)*tm*(p.age<26?p.pot:p.age>=31?.6:1)*rnd(.85,1.15);
    if(G.simmed)xp*=.5;
    if(!played)xp=4*tm*(p.age<26?p.pot:1);
    if(p.inj>0)xp=0;
    const before=p.xp;p.xp+=Math.round(xp);
    if(p.def)p.xp=0;
    xpGain[p.id]=Math.round(xp);
    p.xp=hasRoom(p)?Math.min(p.xp,250):Math.min(p.xp,XP_COST-1);
    if(canUpgrade(p)&&starters.has(p.id))ups.push({id:p.id,lvl:before<XP_COST});
    p.morale=clamp(p.morale+(res==='W'?4:res==='L'?-5:0)+(p.morale<50?2:0)-(!played&&p.ovr>=6?3:0),0,100);
    const y=st.pass+st.rush+st.rec,td=st.td+st.ptd;p.season.yds+=y;p.season.td+=td;p.car.yds+=y;p.car.td+=td;p.season.gp++;p.car.gp++;
  }
  // injuries
  const healed=[],hurt=[];
  for(const p of allPlayers()){if(p.inj>0){p.inj--;if(p.inj===0)healed.push(p.name)}if(p.susp>0)p.susp--}
  for(const p of S.roster){if(p.inj===0&&Math.random()<(.045-(S.fac.rehab-1)*.008)){p.inj=Math.max(1,rint(1,4)-Math.floor((S.fac.rehab-1)/2));hurt.push(`${p.name} (${posOf(p.slot)}) out ${p.inj} wk`)}}
  // MVP
  let mvp=null,mv=-1;for(const p of allPlayers()){const st=G.ps[p.id];if(!st)continue;const v=st.pass/2+st.rush+st.rec+(st.td+st.ptd)*20;if(v>mv){mv=v;mvp=p}}
  LAST={ps:{...G.ps},xpGain,res,us,them,opp:G.opp,home:G.home,playoff:G.playoff,label:G.label,stats:{...G.stats},lines,credits,fd,ups,hurt,healed,obj:obj?obj.txt:'',objOK,mvp:mvp?`${mvp.name} (${posOf(mvp.slot)})`:'—',mvpId:mvp?mvp.id:null,simmed:!!G.simmed,margin:us-them};
  addNews(`${G.label}: ${res==='W'?'Beat':res==='L'?'Lost to':'Tied'} ${TEAMS[G.opp].name} ${us}-${them}.`);
  hurt.forEach(h=>addNews('Injury: '+h));

  if(!G.playoff){
    simOtherGames(S.week);S.results.push({week:S.week,opp:G.opp,us,them,res,home:G.home});
    S.week++;S.objective=pick(OBJ).id;
    if(S.week%2===0){S.fa=S.fa.slice(0,3).concat(genFA(3))}
  }else{advancePlayoff(res==='W')}
  save();Crowd.stop();
  setTimeout(()=>wipe(()=>{mode='hub';G=null;P=null;view='postgame';renderHub();showHub();Music.start()}),400);
}
function simScore(off,def,home){let pts=0;for(let i=0;i<rint(9,12);i++){const r=Math.random();const pTD=clamp(.2+.045*(off-def)+(home?.02:0),.04,.6);if(r<pTD)pts+=Math.random()<.95?7:6;else if(r<pTD+.13)pts+=3}return pts}

const DRAFT_POS=[['QB',3],['RB',3],['WR1',2],['WR2',2],['TE',2.5],['OL1',1],['OL2',1],['K',1],['DL',1.5],['LB',1.5],['CB',1.5],['S',1.5]];

function draftProspects(round,n){

  drawWorld(cam,null,null,Math.floor(t*8)%2===0,fl);
  for(const r of TITLE.runners){r.x+=r.spd*(1/60);if(r.x>cam+40)r.x=cam-40;const[x,y]=w2s(r.x,r.y,cam);ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(x-5,y-1,10,2);ctx.drawImage(getSprite(r.o?TITLE.u1:TITLE.u2,r.tone,(Math.floor(t*10+r.y)%4)+(r.o&&r.y<20?4:0),false),x-7,y-19)}
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(5,7,26,.9)');g.addColorStop(.55,'rgba(5,7,26,.35)');g.addColorStop(1,'rgba(5,7,26,.85)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // spiral pass across the screen
  if(intro&&t>.3&&t<1.25){const s=(t-.3)/.95,x=lerp(-20,W+20,s),y=150-Math.sin(s*Math.PI)*90;ctx.fillStyle='rgba(255,240,200,.25)';for(let i=1;i<6;i++){const s2=Math.max(0,s-i*.025);ctx.fillRect(lerp(-20,W+20,s2),150-Math.sin(s2*Math.PI)*90,2,2)}ctx.fillStyle='#000';ctx.fillRect(x-6,y-4,13,8);ctx.fillStyle='#8a4a1a';ctx.fillRect(x-5,y-3,11,6);ctx.fillStyle='#f5e6c8';ctx.fillRect(x-1,y-3,1,6);ctx.fillRect(x-3,y-1,5,1)}
  const st=intro?(t<1.25?0:Math.min(1,(t-1.25)/.22)):1;
  if(st>0){
    if(!TITLE.slam&&intro){TITLE.slam=true;SFX.kick();snd(70,.35,'sine',.12,-30);TITLE.shake=.35}
    const sc=lerp(3,1,1-Math.pow(1-st,2));const wob=intro?0:Math.round(Math.sin((t-2.2)*2)*2);
    ctx.save();if(TITLE.shake>0){TITLE.shake-=1/60;ctx.translate(rint(-3,3),rint(-2,2))}
    ctx.translate(W/2,58);ctx.scale(sc,sc);ctx.globalAlpha=st;
    bigTxt('GRIDIRON',0,-22+wob,32,'#fff4c0','#ff9a1f');bigTxt('32',0,16+wob,40,'#c9f4ff','#1497d6');ctx.restore();ctx.globalAlpha=1;
    if(intro&&t<1.6){ctx.fillStyle=`rgba(255,255,255,${Math.max(0,.8-(t-1.25)*2.6)})`;ctx.fillRect(0,0,W,H)}
    if(!intro||t>1.6)txt('ARCADE FRANCHISE FOOTBALL',W/2,122,'#ffc933',8,'center');
  }
  if(TITLE.shake>0&&st<=0)TITLE.shake=0;
  ctx.fillStyle='rgba(0,0,0,.08)';for(let y=0;y<H;y+=2)ctx.fillRect(0,y,W,1);
}

}

 {id:'veg',w:()=>2,q:()=>`Quick one from Grandma's Football Blog: are your players eating enough vegetables?`,a:[
  ["Every player gets a salad. Most of them throw it at the linemen.",{team:3},'The linemen confirm. Croutons everywhere.'],
  ["Our offensive line IS the vegetables. Big, round, dependable.",{off:3,fans:2},'The linemen are confused but honored.'],
  ["Ketchup is a vegetable. Next question.",{fans:-1,team:2},'Grandma is disappointed. Grandma has a lot of readers.']]},
 {id:'tub',w:()=>2,q:()=>`Rumor has it the owner wants a hot tub on the sideline. Your take?`,a:[
  ["Only if it's heated to exactly 101 degrees.",{team:4},'The owner has ordered the hot tub.'],
  ["Football is about suffering. No hot tubs.",{fans:3,team:-3},'Old-school fans approve. The players do not.'],
  ["I'll be in it. Calling plays. Wearing goggles.",{fans:2,team:2},'This image will haunt the league for years.']]},
 {id:'mascot',w:()=>2,q:()=>`The mascot fell off the trampoline again. Should he retire?`,a:[
  ["Never. He is the heart and soul of this franchise.",{fans:4},'The mascot does a celebratory backflip. He falls.'],
  ["He's on a one-year deal. We'll evaluate everything in the offseason.",{fans:-2,team:2},'The mascot is seen updating his resume.'],
  ["I've asked him to wear a helmet. He refuses. I respect it.",{fans:2,team:1},'Helmet sales spike.']]},
 {id:'fav',w:c=>c.rb?2:0,q:()=>`A fan wants to know: what's your favorite play in the playbook?`,a:[
  ["The one that works.",{fans:2},'Cold. Correct.'],
  ["Anything that ends with my running back somersaulting into the end zone.",{fans:3,p:'rb',n:5},'{rb} has started practicing somersaults.'],
  ["I can't say. It's a secret. It's also the only play I know.",{fans:1,team:1},'Opposing scouts are taking notes. They should not.']]},
 {id:'refs',w:()=>2,q:()=>`Any thoughts on the officiating today?`,a:[
  ["They did their best. Their best was not great, but they did it.",{fans:2,cc:-1},'The league fines you a coaching credit. Fans think it was worth it.'],
  ["No comment. My lawyer is the guy in the hot dog costume.",{fans:3},'The guy in the hot dog costume waves.'],
  ["I thought they called a beautiful game.",{team:-1,fans:-1},'Your players look at you like you have lost your mind.']]},

 {id:'wrdrop',ctx:1,w:c=>c.wr&&c.L.res==='L'?5:0,q:()=>`{wr} struggled to hold on to the ball today. Is it time to worry about his hands?`,a:[
  ["His hands are fine. The ball was slippery. Probably covered in butter.",{p:'wr',n:10,fans:-1},'{wr} nods. He has been told, in confidence, it was butter.'],
  ["Yes. We need to see more from him. Immediately.",{p:'wr',n:-12,team:2},'{wr} stares at the floor. His glove is on the wrong hand.'],
  ["We all drop things. I dropped my coffee this morning. Twice.",{p:'wr',n:3,fans:1},'The reporter writes "coffee" and underlines it.']]},
 {id:'wrbig',ctx:1,w:c=>c.wr&&c.L.res==='W'?4:0,q:()=>`{wr} looked unstoppable. Is he a top-five receiver in this league?`,a:[
  ["Top five? Top one. Next question.",{p:'wr',n:12,team:-2},'{wr} gets a little taller. The other receivers do not.'],
  ["He's good. But he'd be better if he did the dishes.",{p:'wr',n:4,team:2},'The locker room laughs. {wr} does the dishes.'],
  ["We don't rank players. We rank sandwiches.",{team:2,fans:1},'A strong, if odd, answer.']]},
 {id:'olsacks',ctx:1,w:c=>c.ol&&c.L.stats.sacks>=3?7:0,q:c=>`The offensive line gave up ${c.L.stats.sacks} sacks today. Should {ol} be benched?`,a:[
  ["No. We win and lose as a line.",{p:'ol',n:8,team:3},'{ol} appreciates the support. His back does not.'],
  ["Yes, he gets a day to think about what he did.",{p:'ol',n:-14,team:-1},'{ol} goes to think about it. He seems to be thinking about snacks.'],
  ["Sacks happen. The quarterback should simply be harder to find.",{fans:1,team:1},'The reporters are not sure if you were joking.']]},
 {id:'cbburn',ctx:1,w:c=>c.cb&&c.L.res==='L'?4:0,q:()=>`{cb} got burned a few times in coverage. Is he a liability?`,a:[
  ["He's learning. Everybody gets burned. Including toast.",{p:'cb',n:8,fans:-1},'{cb} puts a hand over his face. He likes toast.'],
  ["He needs to be better. That's a big week of film for him.",{p:'cb',n:-10,team:3},'{cb} picks up the playbook. He puts it back down. Then picks it up again.'],
  ["No. The corner is a hard position. It is basically a lot of running backwards.",{fans:1},'True, true.']]},
 {id:'dlmonster',ctx:1,w:c=>c.dl&&c.L.res==='W'?4:0,q:()=>`{dl} was a monster up front today. Does the defense get enough credit?`,a:[
  ["Never. Defense wins championships. Defense also eats more.",{p:'dl',n:10,team:2},'{dl} lifts a reporter off the ground as a thank you.'],
  ["Offense gets the glory. I like that. It keeps them humble.",{p:'dl',n:-6,team:2,fans:1},'The defense mutters in the corner.'],
  ["{dl} is basically a very strong wall that is sometimes also a person.",{p:'dl',n:6,fans:3},'{dl} screenshots that for his profile.']]},
 {id:'stargood',w:c=>c.star?5:0,q:()=>`{star} seems to be the heart of this team. What makes him so special?`,a:[
  ["He shows up early, stays late and microwaves fish in the office.",{p:'star',n:8,fans:2},'{star} denies the fish. Everybody knows the fish.'],
  ["Talent. But also fear. He is a little scary.",{p:'star',n:5,team:2},'{star} accepts the compliment.'],
  ["Honestly? He's carried us. The rest of us are holding the rope.",{p:'star',n:10,team:-3},'The rest of the team takes mild offense.']]},
 {id:'starwants',w:c=>c.star&&S.phase!=='playoffs'?3:0,q:()=>`There are rumors that {star} is unhappy here and wants out. Is that true?`,a:[
  ["He loves it here. He told me. It was in a note.",{p:'star',n:8,fans:2},'{star} confirms there was a note. Nobody has seen it.'],
  ["I don't comment on rumors. I also don't comment on facts.",{p:'star',n:-4,fans:-1},'{star} looks at his phone and sighs.'],
  ["He can leave if he wants. I would, too. We play outdoors.",{p:'star',n:-12,fans:3},'{star} was not aware you could say that into a microphone.']]},
 {id:'vetretire',w:c=>c.vet?4:0,q:()=>`{vet} isn't getting any younger. Is it time to think about hanging them up?`,a:[
  ["Age is just a number. A big number. But a number.",{p:'vet',n:10,fans:1},'{vet} stretches, and several things pop.'],
  ["He's fine as long as he keeps up with the young guys.",{p:'vet',n:-3,team:2},'{vet} resolves to prove it on the next play.'],
  ["The only thing he's retiring is his Wednesday nap.",{p:'vet',n:5,fans:3},'{vet} considers that. He does not deny it.']]},
 {id:'rookienerves',w:c=>c.rookie?4:0,q:()=>`{rookie} looked a little nervous out there. How is the rookie handling it?`,a:[
  ["He's doing great. He just needs a hug. Which I will not give him.",{p:'rookie',n:8,fans:1},'{rookie} looks relieved and a little confused.'],
  ["He needs to grow up fast. This isn't a school bake sale.",{p:'rookie',n:-9,team:2},'{rookie} writes a note to self: grow up fast.'],
  ["He's a pro. He's just very polite about it.",{p:'rookie',n:5,team:1},'The reporters write "polite" in their notepads.']]},
 {id:'rookiesteal',w:c=>c.rookie&&c.L.res==='W'?4:0,q:()=>`{rookie} has been a pleasant surprise. Was he a steal?`,a:[
  ["Absolutely. He was cheaper than a coffee machine.",{p:'rookie',n:6,fans:2},'{rookie} accepts this as a compliment. Probably.'],
  ["We just draft the guys we like. It's not complicated. It is, though. I have a spreadsheet.",{team:2,fans:1},'A spreadsheet is mentioned. A reporter asks for a copy.'],
  ["I'd rather give the credit to his mother. She raised him right.",{p:'rookie',n:10,fans:3},'{rookie} tears up. Moms everywhere are happy.']]},
 {id:'benchfair',w:c=>c.bench?3:0,q:()=>`{bench} hasn't seen the field much. Is he getting a fair shot?`,a:[
  ["He's earning his spot. I keep a very strict chart.",{p:'bench',n:-5,team:2},'{bench} looks at the chart. The chart looks back.'],
  ["He's gonna get his chance. Everybody gets a chance. Even you.",{p:'bench',n:12,team:-1},'{bench} picks up the pace in practice. His helmet is on backwards.'],
  ["He's been playing. In my heart.",{p:'bench',n:4,fans:-1},'{bench} puts a hand over his heart. It is the wrong side.']]},
 {id:'tefunny',w:c=>c.te?3:0,q:()=>`Who's the funniest guy in the locker room? Is it {te}?`,a:[
  ["It's {te}. He does impressions. Of me. They are accurate.",{p:'te',n:10,fans:2},'{te} bows. He has been asked to do the impression on camera.'],
  ["It's the equipment guy. He can make a jersey talk.",{team:3},'The equipment guy has just been told. He is thrilled.'],
  ["No comment. The locker room is a sacred place.",{team:1,fans:-1},'Sacred, sure. But there are definitely jokes in there.']]},
 {id:'lbcheap',ctx:1,w:c=>c.lb&&c.L.res==='L'?3:0,q:()=>`{lb} was caught on camera arguing with the referee. Do you support that?`,a:[
  ["I support all my players, including when they argue with the referee.",{p:'lb',n:8,fans:-2},'{lb} gives a thumbs up to the camera. And a second to the referee.'],
  ["No. We keep our cool. Arguing with the referee is how you lose a flag.",{p:'lb',n:-9,team:3},'{lb} puts on his serious face and looks away.'],
  ["The referee started it. I saw the whole thing. I was in the bathroom.",{fans:3,team:1},'The reporters are not sure who to quote.']]},
 {id:'sfun',w:c=>c.s?3:0,q:()=>`{s} says he can bench-press a small car. Is that true?`,a:[
  ["Let's find out. Somebody get me a small car.",{p:'s',n:8,fans:3},'{s} tests it. The car is fine. The parking brake is not.'],
  ["We don't talk about that. Insurance won't let us.",{fans:1,team:1},'The insurance guy in the back row nods.'],
  ["Honestly, he could. He's scary. I try not to make eye contact.",{p:'s',n:6,team:1},'{s} makes sure to make eye contact with you all week.']]},
 {id:'kickergood',ctx:1,w:c=>c.k&&c.L.stats.fg>=2?4:0,q:()=>`{k} was perfect on field goals. Is the kicker the real MVP?`,a:[
  ["Kickers are people too. Weird people. But people.",{p:'k',n:12,team:-1},'{k} gets a standing ovation. From himself.'],
  ["MVP? The MVP is the guy who snaps. Nobody ever thanks the snapper.",{team:3},'The long snapper cries quietly in the parking lot.'],
  ["The kicker is a very small person who does a very big thing.",{p:'k',n:6,fans:2},'{k} is not sure if he was just insulted.']]},
];
let PRESS=null;
function pressCtx(){
  const L=LAST,g=s=>active(s),np=p=>p&&!p.def?p:null;
  const real=S.roster.filter(p=>!p.def),all=allPlayers().filter(p=>!p.def);
  const star=real.slice().sort((a,b)=>b.ovr-a.ovr)[0]||null;
  const rookie=all.filter(p=>p.acq===S.season).sort((a,b)=>b.age-a.age).pop()||all.slice().sort((a,b)=>a.age-b.age)[0]||null;
  const vet=all.slice().sort((a,b)=>b.age-a.age)[0]||null;
  const bench=S.bench.filter(p=>!p.def)[0]||null;
  return {L,me:S.teams[S.team],qb:np(g('QB')),k:np(g('K')),rb:np(g('RB')),mvp:findP(L.mvpId),elim:S.phase==='regular'&&isEliminated(),
    wr:np(g('WR1')),wr2:np(g('WR2')),te:np(g('TE')),ol:np(g('OL1')),dl:np(g('DL')),lb:np(g('LB')),cb:np(g('CB')),s:np(g('S')),star,rookie:rookie&&rookie.age<=24?rookie:null,vet:vet&&vet.age>=29?vet:null,bench};
}
function choosePQ(c){
  const recent=new Set(S.pq||[]);const pool=PQ.filter(q=>q.w(c)>0&&!recent.has(q.id));
  const wpick=list=>{const tot=list.reduce((a,q)=>a+q.w(c),0);let r=Math.random()*tot;for(const q of list){r-=q.w(c);if(r<=0)return q}return list[0]};
  const out=[];const ctxQ=pool.filter(q=>q.ctx);if(ctxQ.length)out.push(wpick(ctxQ));
  const rest=pool.filter(q=>!out.includes(q));if(rest.length&&(out.length===0||Math.random()<.9))out.push(wpick(rest));
  if(!out.length)out.push(pick(PQ.filter(q=>!q.ctx)));
  S.pq=(S.pq||[]).concat(out.map(q=>q.id)).slice(-8);
  return out;
}
function pressConference(){
  const c=pressCtx();PRESS={c,qs:choosePQ(c),i:0,answered:false,rep:[...REPORTERS].sort(()=>Math.random()-.5)};
  wipe(()=>{renderPress();$('#press').hidden=false;SFX.flash()});
}
const PKEYS='qb|mvp|k|rb|wr2|wr|te|ol|dl|lb|cb|s|star|rookie|vet|bench';
function fillNames(s,c){return s.replace(new RegExp('\\{('+PKEYS+')\\}','g'),(_,k)=>c[k]?c[k].name:'He')}
function roomHTML(){
  const t=TEAMS[S.team],ik=ink(t);
  const flashes=[...Array(6)].map((_,i)=>`<i class="flash" style="left:${8+i*15+rint(-4,4)}%;top:${rint(40,75)}%;animation-delay:${(i*.43+Math.random()).toFixed(2)}s"></i>`).join('');
  return `<div class="room"><div class="wall" style="background:radial-gradient(ellipse at 50% 30%,${shade(t.c1,.12)},${shade(t.c1,-.55)} 70%);"></div>
  <div class="wall" style="opacity:.16;background:repeating-linear-gradient(45deg,${ik} 0 2px,transparent 2px 46px),repeating-linear-gradient(-45deg,${ik} 0 2px,transparent 2px 46px)"></div>
  <div class="wall" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));align-content:start;gap:24px 10px;padding:16px;opacity:.28;font-family:var(--px);font-size:11px;color:${ik};overflow:hidden">${Array(24).fill(`<span>${esc(t.ab)} · G32</span>`).join('')}</div>
  ${flashes}<div class="crowdrow"></div>
  <div class="podium"><div class="bigcrest" style="background:${t.c1};color:${ik}">${esc(t.ab)}</div><div class="nameplate">COACH ${esc(S.coach.toUpperCase())}</div><div class="stand" style="background:${t.c1};color:${ik}"><div class="mics"><i></i><i></i><i></i></div>${esc(t.name.toUpperCase())}</div></div></div>`;
}
function featuredPlayer(q,c){const m=(q.q(c)+' '+q.a.map(x=>x[0]).join(' ')).match(new RegExp('\\{('+PKEYS+')\\}'));const k=(q.a.map(x=>x[1].p).find(Boolean))||(m&&m[1]);return k&&c[k]?c[k]:null}
function fxHint(fx,c){
  const out=[];const add=(l,v)=>{if(v)out.push(`<span class="eh ${v>0?'p':'n'}">${v>0?'▲':'▼'} ${l}</span>`)};
  add('TEAM',fx.team);add('OFF',fx.off);add('DEF',fx.def);if(fx.p&&c[fx.p])add(c[fx.p].name.split(' ').slice(-1)[0].toUpperCase(),fx.n);add('FANS',fx.fans);add('CC',fx.cc);
  return out.join('')||'<span class="eh">—</span>';
}
function renderPress(){
  const P2=PRESS,q=P2.qs[P2.i],c=P2.c,[rn,ro]=P2.rep[P2.i%P2.rep.length];
  const qtxt=fillNames(q.q(c),c),fp=featuredPlayer(q,c),tm=teamMorale(),f=faceOf(tm);
  const rLook=coordLook(rn);rLook.headset=false;rLook.hat='none';
  const card=fp?rcard(fp,false,'div'):`<div class="rcard g-off pteam"><div class="rtop"><span class="rpos">PRESS</span></div><div class="rbody">${coachImg(rLook,{c1:'#3a3f52',c2:'#e8e8e8'},'m',true)}</div><div class="rname">${esc(rn.split(' ').slice(-1)[0])}</div></div>`;
  $('#press').innerHTML=`<div class="pi"><div class="pi-top"><span class="pi-cc">${S.credits} CC</span><span class="pi-count">QUESTION ${P2.i+1} / ${P2.qs.length}</span></div>
  <h2 class="pi-title">PRESS INTERVIEW</h2>
  <div class="pi-rep">${esc(rn)} · ${esc(ro)}</div>
  <div class="pi-main"><div class="pi-card">${card}</div><div class="pi-bubble" id="qtext" aria-live="polite"></div><div class="pi-morale"><span>MORALE</span><b id="pmor" class="m-${f[0]}t">${tm}% ${f[1]}</b></div></div>
  <div class="pi-answers" id="answers">${q.a.map((a,i)=>`<div class="pi-ans"><div class="pi-fx"><span class="pi-fxl">EFFECT</span><div class="pi-hints">${fxHint(a[1],c)}</div></div><button class="pi-btn" data-act="answer" data-arg="${i}">"${esc(fillNames(a[0],c))}"</button></div>`).join('')}</div></div>`;
  const el=$('#qtext');let i=0;clearInterval(P2.tw);
  P2.tw=setInterval(()=>{i+=2;el.textContent=qtxt.slice(0,i);if(i%6===0)SFX.tick();if(i>=qtxt.length){clearInterval(P2.tw);el.textContent=qtxt}},22);
}
function applyFx(fx,c){
  const chips=[];const ch=(l,v)=>chips.push(`<span class="fx ${v>=0?'p':'n'}">${l} ${v>=0?'+':''}${v}</span>`);
  const mor=(list,v)=>list.forEach(p=>{if(p)p.morale=clamp(p.morale+v,0,100)});
  if(fx.team){mor(allPlayers(),fx.team);ch('TEAM MORALE',fx.team)}
  if(fx.off){mor(OFF_SLOTS.map(getSlot),fx.off);ch('OFFENSE MORALE',fx.off)}
  if(fx.def){mor(['DL','LB','CB','S'].map(getSlot),fx.def);ch('DEFENSE MORALE',fx.def)}
  if(fx.p&&c[fx.p]){mor([c[fx.p]],fx.n);ch(c[fx.p].name.toUpperCase()+' MORALE',fx.n)}
  if(fx.fans){S.fans=clamp(S.fans+fx.fans,0,120);ch('FANS',fx.fans)}
  if(fx.cc){S.credits=Math.max(0,S.credits+fx.cc);ch('CREDITS',fx.cc)}
  return chips.join('');
}
function answerPress(i){
  const P2=PRESS;if(!P2||P2.answered)return;P2.answered=true;clearInterval(P2.tw);
  const q=P2.qs[P2.i],a=q.a[+i],c=P2.c;$('#qtext').textContent=fillNames(q.q(c),c);
  const chips=applyFx(a[1],c);save();
  const good=(a[1].fans||0)+(a[1].team||0)>=3;good?SFX.good():SFX.tick();
  const last=P2.i>=P2.qs.length-1;
  const tm=teamMorale(),f2=faceOf(tm),pm=$('#pmor');if(pm){pm.className='m-'+f2[0]+'t';pm.innerHTML=tm+'% '+moodIcon(tm,20)}
  $('#answers').innerHTML=`<div class="pi-result" style="animation:pop .3s"><p>"${esc(fillNames(a[0],c))}"</p><p class="react">${esc(fillNames(a[2],c))}</p><div class="fxchips">${chips}</div>
  <div class="row" style="margin-top:12px"><span class="spacer"></span><button class="pi-btn go" data-act="pressNext">${last?'LEAVE THE PODIUM ▶':'NEXT QUESTION ▶'}</button></div></div>`;
  const nb=$('#answers .pi-btn');if(nb){nb.scrollIntoView({block:'nearest',behavior:'smooth'});nb.focus({preventScroll:true})}
}
function pressNext(){const P2=PRESS;P2.i++;P2.answered=false;if(P2.i<P2.qs.length){renderPress();return}PRESS=null;wipe(()=>{$('#press').hidden=true;afterPost()})}

/* ---------- offseason screens ---------- */
function renderOffseason(still){
  const O=S.off;const hub=$('#hub');let body='';
  if(O.step==='recap'){const h=S.history[S.history.length-1];const ch=TEAMS[S.playoff.champ];
    body=`<div class="panel"><p class="ptitle">SEASON ${S.season} COMPLETE</p><div class="row">${crest(ch)}<div><p class="sub" style="margin:0">GRIDIRON CUP CHAMPION</p><p class="big ${h.won?'gold':''}" style="margin:0">${esc(ch.name.toUpperCase())}</p></div></div><p style="margin-top:10px">Your season: ${h.w}-${h.l}${h.t?'-'+h.t:''}. ${h.won?'Your franchise is on top of the league.':h.made?'You made the playoffs.':'No playoffs. The draft is where this gets fixed.'}</p>${bracketHTML()}<div class="row" style="margin-top:12px"><button class="btn" data-act="offNext">START OFFSEASON ▶</button></div></div>`}
  if(O.step==='aging')body=`<div class="panel"><p class="ptitle">PLAYER DEVELOPMENT</p><div class="lu">${O.notes.map(n=>`<div class="row">${esc(n.n)} ${esc(n.t)} ${n.o!=null?starsHTML(n.o):''}</div>`).join('')||'<div class="sub">No changes.</div>'}</div><div class="row" style="margin-top:12px"><button class="btn" data-act="offNext">CONTRACTS ▶</button></div></div>`;
  if(O.step==='resign'){const ex=allPlayers().filter(p=>p.yrs<=0);
    body=`<div class="panel"><p class="ptitle">EXPIRING CONTRACTS</p>${ex.length?`<div class="scroll"><table class="tbl"><tbody>${ex.map(p=>{const ask=+(salaryFor(p.ovr)*(p.morale<40?1.4:1)).toFixed(1);return `<tr><td><div class="who">${playerImg(p)}<span class="tag pos">${posOf(p.slot)}</span></div></td><td>${esc(p.name)}</td><td>${p.age}</td><td>${starsHTML(p.ovr)}</td><td>asks $${ask}M × 3</td><td><button class="btn green xs" data-act="resign" data-arg="${p.id}">RE-SIGN</button> <button class="btn ghost xs" data-act="letgo" data-arg="${p.id}">LET GO</button></td></tr>`}).join('')}</tbody></table></div>`:'<p class="sub">All contracts handled.</p>'}
    <div class="row" style="margin-top:12px"><span class="sub">Cap: $${payroll()}M of $${capTotal()}M</span><span class="spacer"></span><button class="btn" data-act="offNext" ${ex.length?'disabled':''}>DRAFT ▶</button></div></div>`}
  if(O.step==='draft')body=draftHTML();
  hub.innerHTML=`<div class="wrap${still?' still':''}">${headerHTML()}${body}${O.step==='draft'?'':`<div class="panel"><p class="ptitle">ROSTER</p>${rosterTable()}</div>`}</div>`;
}
function draftHTML(){
  if(!S.off.draft.picks||!S.off.draft.cls)buildDraft();
  const D=S.off.draft,tab=D.tab==='roster'?'roster':'draft';
  const tabs=`<div class="tabs" role="tablist"><button class="tab" role="tab" aria-selected="${tab==='draft'}" data-act="dTab" data-arg="draft">DRAFT BOARD</button><button class="tab" role="tab" aria-selected="${tab==='roster'}" data-act="dTab" data-arg="roster">MY ROSTER (${S.roster.filter(p=>!p.def).length+S.bench.filter(p=>!p.def).length})</button><span class="spacer"></span><span class="sub" style="align-self:center">Cap $${payroll().toFixed(1)}M of $${capTotal()}M · ${S.credits} CC · Bench ${S.bench.length}/${BENCH_MAX}</span></div>`;
  if(tab==='roster')return tabs+`<div class="panel"><p class="ptitle">YOUR ROSTER</p><p class="sub" style="margin-bottom:8px">Check who you need, then switch back to the draft board. You can also trade or cut a player here to free cap space or bench room.</p>${rosterTable()}</div>`;
  return tabs+draftBody();
}
function draftBody(){
  if(!S.off.draft.picks||!S.off.draft.cls)buildDraft();
  const D=S.off.draft,pk=curPick();
  const stars=n=>starsHTML(n);
  const done=D.log.map(l=>l.sold?`<div class="pk"><span class="pkn">R${l.round}</span><span class="sub">Pick sold</span><span class="spacer"></span><b class="cyan">+${l.sold} CC</b></div>`:`<div class="pk mine"><span class="pkn">R${l.round}</span><span style="min-width:0">${esc(l.name)} <span class="tag pos">${l.pos}</span></span><span class="spacer"></span>${stars(l.ovr)}<span class="sub">${l.where==='bench'?'BENCH':'STARTS'}</span></div>`).join('')||'<p class="sub">No picks made yet.</p>';
  if(!pk)return `<div class="panel"><p class="ptitle">ROOKIE DRAFT · COMPLETE</p><p class="sub" style="margin-bottom:8px">Your rookies have joined the team.</p><div class="ticker">${done}</div><div class="row" style="margin-top:12px"><span class="spacer"></span><button class="btn" data-act="offNext">START SEASON ${S.season+1} ▶</button></div></div>`;
  if(!D.started){
    const cnt={};['QB','RB','WR','TE','OL','K','DL','LB','CB','S'].forEach(k=>cnt[k]=0);[1,2,3].forEach(r=>D.cls[r].forEach(p=>{const k=posOf(p.slot).replace(/\d/,'');cnt[k]=(cnt[k]||0)+1}));
    const tbl=r=>`<div class="panel"><p class="ptitle">ROUND ${r} PROSPECTS</p><div class="scroll"><table class="tbl"><thead><tr><th></th><th>NAME</th><th>NOW</th><th>POTENTIAL</th><th>SALARY</th></tr></thead><tbody>${D.cls[r].map(p=>`<tr><td><div class="who"><img class="pt s" src="${portrait(p.look,COLLEGE,'player').url}" alt=""><span class="tag pos">${posOf(p.slot)}</span></div></td><td>${esc(p.name)}<div class="sub" style="font-size:16px">${esc(p.college)}</div></td><td>${stars(p.ovr)}</td><td>${stars(p.ceil)}</td><td>$${p.sal.toFixed(1)}M</td></tr>`).join('')}</tbody></table></div></div>`;
    return `<div class="panel"><div class="dhead"><p class="ptitle" style="margin:0">ROOKIE DRAFT · THE CLASS</p><span class="spacer"></span><button class="btn" data-act="startDraft">START DRAFT ▶</button></div>
    <p class="sub" style="margin-top:8px">Here is everyone in this year's draft: ${Object.entries(cnt).filter(e=>e[1]).map(e=>`${e[1]} ${e[0]}`).join(' · ')}. You have ${D.picks.length} picks (${[1,2,3].map(r=>D.picks.filter(x=>x.round===r).length+' in round '+r).join(', ')}). Each round, you choose from that round's group.</p></div>${tbl(1)}${tbl(2)}${tbl(3)}`;
  }
  const left=D.picks.length-D.idx;
  const cards=draftCards(pk.round).map(p=>`<div class="dcard2">${rcard(p,false,'div',`<div class="rsal">$${p.sal.toFixed(1)}M</div><div class="rpot">POTENTIAL</div><div class="rstars">${stars(p.ceil)}</div>`,true)}<button class="btn xs" data-act="draft" data-arg="${p.id}">DRAFT</button></div>`).join('');
  return `<div class="panel"><div class="dhead"><p class="ptitle" style="margin:0">ROOKIE DRAFT · ROUND ${pk.round} · PICK ${D.picks.slice(0,D.idx).filter(x=>x.round===pk.round).length+1} OF ${D.picks.filter(x=>x.round===pk.round).length}</p><span class="spacer"></span><span class="sub">${left} pick${left===1?'':'s'} left · Cap $${payroll().toFixed(1)}M of $${capTotal()}M · ${S.credits} CC</span></div>
  <p class="sub" style="margin-top:8px">Three rounds, two picks each — choose one rookie per pick. Each round has its own group of prospects, and higher rounds are better. Rookies are cheap but still count against the salary cap. They take an open (default) spot, otherwise they join your bench. Trade a player for more picks.</p></div>
  <div class="panel"><div class="rgrid draftgrid">${cards}</div><div class="row" style="margin-top:12px"><span class="sub">Don't want anyone, or no cap room? Sell this pick instead.</span><span class="spacer"></span><button class="btn ghost sm" data-act="sellPick">SELL PICK +${PICK_CC[pk.round]||1} CC</button></div></div>
  ${D.log.length?`<div class="panel"><p class="ptitle">YOUR ROOKIES</p><div class="ticker">${done}</div></div>`:''}`;
}
function offNext(){const O=S.off;
  if(O.step==='recap'){O.notes=runAging();O.step='aging'}
  else if(O.step==='aging'){O.step='resign'}
  else if(O.step==='resign'){O.step='draft';buildDraft()}
  else if(O.step==='draft'){if(curPick())return;newSeason();view='home'}
  save();renderHub();
}
function draftUser(p){
  if(!p||!curPick())return;
  const room=capTotal()-payroll();if(p.sal>room+1e-9)return toast(`${p.name} costs $${p.sal.toFixed(1)}M a year and you only have $${Math.max(0,room).toFixed(1)}M of cap space. Free up space by cutting or trading a player, or sell this pick for coaching credits.`);
  makePick(p);SFX.draft();save();renderHub(true);
}

const _update=update;
update=function(dt){if(!$('#modal').hidden&&mode==='game')return;_update(dt)};

/* ---------- boot: click to start → Ericson Interactive intro → title ---------- */
fit();
(document.fonts&&document.fonts.load?Promise.all([document.fonts.load("8px 'Press Start 2P'"),document.fonts.load("16px 'Press Start 2P'")]).catch(()=>{}):Promise.resolve()).then(()=>{TITLE=null});
let booted=false;
function boot(){if(booted)return;booted=true;audio();$('#gate').hidden=true;$('#intro').hidden=false;Intro.start(()=>{$('#intro').hidden=true;titleScreen(false)})}
$('#gate').addEventListener('pointerdown',boot);
$('#intro').addEventListener('pointerdown',()=>Intro.press());
addEventListener('keydown',e=>{if(!booted){boot();return}if(Intro.running&&[' ','enter','escape'].includes(e.key.toLowerCase())){e.preventDefault();Intro.press()}},true);
mode='boot';
requestAnimationFrame(loop);


/* ===================== MOBILE RUNTIME ===================== */
(function(){
  const vib=p=>{try{navigator.vibrate&&SET.sound!==undefined&&navigator.vibrate(p)}catch(_){}};
  const HP={tackle:28,td:[40,40,40,40,90],bad:70,juke:12,catch:8,whistle:10,draft:[20,30,20]};
  for(const k in HP){const f=SFX[k];if(typeof f==='function')SFX[k]=function(){vib(HP[k]);return f.apply(this,arguments)}}
  let fsDone=false;
  const goFull=()=>{if(fsDone)return;fsDone=true;try{const el=document.documentElement;const rq=el.requestFullscreen||el.webkitRequestFullscreen;if(rq){const r=rq.call(el,{navigationUI:'hide'});r&&r.catch&&r.catch(()=>{})}}catch(_){}
    try{screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{})}catch(_){}};
  let wl=null;const keep=async()=>{try{if(navigator.wakeLock&&document.visibilityState==='visible')wl=await navigator.wakeLock.request('screen')}catch(_){}};
  addEventListener('pointerdown',()=>{goFull();keep()},{once:false,passive:true});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')keep()});
  addEventListener('contextmenu',e=>{if(!(e.target&&e.target.tagName==='INPUT'))e.preventDefault()});
  addEventListener('gesturestart',e=>e.preventDefault());
  addEventListener('dblclick',e=>e.preventDefault());
  fit();
})();
</script>
</body>
</html>
